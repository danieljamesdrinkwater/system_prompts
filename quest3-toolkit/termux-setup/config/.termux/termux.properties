# =============================================================================
# Quest 3 Termux Properties
# Optimized keyboard and terminal settings for Meta Quest 3
# =============================================================================

# ---------------------------------------------------------------------------
# Extra keys configuration
# Two rows of extra keys for better coverage on Quest 3 virtual keyboard
#
# Row 1: Common control and navigation keys
# Row 2: Symbols frequently used in development
# ---------------------------------------------------------------------------
extra-keys = [[ \
  {key: ESC, popup: {macro: "CTRL d", display: "EOF"}}, \
  {key: TAB, popup: {macro: "CTRL z", display: "SUSP"}}, \
  {key: CTRL, popup: {macro: "CTRL c", display: "INT"}}, \
  {key: ALT, popup: {macro: "CTRL a", display: "HOME"}}, \
  {key: UP, popup: {macro: "CTRL e", display: "END"}}, \
  {key: DOWN, popup: PAGE_DOWN}, \
  {key: LEFT, popup: HOME}, \
  {key: RIGHT, popup: END} \
],[ \
  {key: '|', popup: '&'}, \
  {key: '-', popup: '_'}, \
  {key: '/', popup: '\\\\'}, \
  {key: '~', popup: '`'}, \
  {key: '{', popup: '}'}, \
  {key: '[', popup: ']'}, \
  {key: '=', popup: '+'}, \
  {key: '*', popup: '#'} \
]]

# ---------------------------------------------------------------------------
# Volume keys behavior
# Disabled as extra keys so physical volume buttons control media volume,
# which is more useful on Quest 3 where audio feedback matters.
# ---------------------------------------------------------------------------
volume-keys = volume

# ---------------------------------------------------------------------------
# Bell style
# Use vibrate for tactile feedback without audible noise in VR.
# ---------------------------------------------------------------------------
bell-character = vibrate
