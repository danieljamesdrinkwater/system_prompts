# HGV-ADAS WiFi Access Point — Pi hosts the network for ESP32 radar pods
# Interface: wlan0 (built-in Pi WiFi)
# This creates the "HGV-ADAS" network that radar pods connect to.
#
# Install: sudo apt install hostapd
# Enable:  sudo systemctl unmask hostapd && sudo systemctl enable hostapd
# Config:  sudo cp hostapd.conf /etc/hostapd/hostapd.conf

interface=wlan0
driver=nl80211
ssid=HGV-ADAS
hw_mode=g
channel=7
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=adaspass123
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
