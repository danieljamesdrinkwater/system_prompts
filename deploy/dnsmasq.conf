# DHCP for HGV-ADAS WiFi network
# Assigns IPs to ESP32 radar pods on the Pi's access point.
#
# Install: sudo apt install dnsmasq
# Config:  sudo cp dnsmasq.conf /etc/dnsmasq.d/hgv-adas.conf

interface=wlan0
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,24h
domain=local
address=/hgv-adas.local/192.168.4.1
