# AI File Manager Configuration

drop_zone: "~/Desktop/File Manager"

openrouter:
  api_key: "YOUR_OPENROUTER_API_KEY_HERE"
  model: "google/gemini-2.0-flash-001"
  timeout: 30
  analyze_content: true
  max_content_chars: 2000

stabilization_delay: 2.0

logging:
  level: "INFO"
  file: "~/.file-manager/file_manager.log"
  max_bytes: 10485760  # 10MB
  backup_count: 3

hierarchy:
  Documents:
    subcategories:
      - Work
      - Personal
      - Finance/Invoices
      - Finance/Receipts
      - Finance/Statements
      - Education
      - Legal
      - Medical
      - Notes
    extensions:
      - .pdf
      - .doc
      - .docx
      - .xls
      - .xlsx
      - .ppt
      - .pptx
      - .odt
      - .rtf
      - .txt
      - .md
      - .csv
  Images:
    subcategories:
      - Photos
      - Screenshots
      - Graphics
      - Icons
      - Wallpapers
    extensions:
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .bmp
      - .tiff
      - .webp
      - .heic
      - .ico
      - .svg
  Videos:
    subcategories:
      - Recordings
      - Tutorials
      - Personal
    extensions:
      - .mp4
      - .mov
      - .avi
      - .mkv
      - .wmv
      - .flv
      - .webm
  Audio:
    subcategories:
      - Music
      - Podcasts
      - Recordings
      - Sound Effects
    extensions:
      - .mp3
      - .wav
      - .flac
      - .aac
      - .ogg
      - .m4a
      - .wma
  Downloads:
    subcategories:
      - Installers
      - Archives
      - Packages
    extensions:
      - .exe
      - .msi
      - .dmg
      - .pkg
      - .deb
      - .rpm
      - .appimage
      - .zip
      - .tar
      - .gz
      - .7z
      - .rar
      - .bz2
      - .xz
  Code:
    subcategories:
      - Scripts
      - Projects
      - Snippets
      - Data
    extensions:
      - .py
      - .js
      - .ts
      - .java
      - .c
      - .cpp
      - .go
      - .rs
      - .rb
      - .sh
      - .bat
      - .ps1
      - .sql
      - .json
      - .xml
      - .yaml
      - .yml
      - .toml
      - .ini
      - .cfg
  Design:
    subcategories:
      - PSD
      - Figma Exports
      - SVG
      - Mockups
    extensions:
      - .psd
      - .ai
      - .sketch
      - .fig
      - .xd
      - .indd
  Miscellaneous:
    subcategories: []
    extensions: []
